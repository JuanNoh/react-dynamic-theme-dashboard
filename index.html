<!doctype html>
<html lang="es" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chuwen Palette · Generador de paletas de color</title>
  <meta name="description"
    content="Describe tu marca o escoge un color y obtén una escala completa, con buen contraste y lista para exportar a Tailwind, CSS o JSON. Gratis y sin cuenta." />
  <script>
    (function () {
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
